# Gates mínimos de CI — copie para .github/workflows/gates.yml
# Adapte os blocos de teste à sua linguagem. Os gates de segurança são universais:
# eles BLOQUEIAM (exit-code 1), não apenas avisam.
name: gates
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # histórico completo para o secret-scan

      # Secrets no código e no histórico (não só na HEAD)
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependências vulneráveis — varre os manifests que existir
      - name: SCA (trivy filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true      # bloqueia o que já tem fix disponível

  testes:
    runs-on: ubuntu-latest
    needs: seguranca
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --- JavaScript / TypeScript ---
      - if: hashFiles('package.json') != ''
        name: JS/TS (npm ci exige lockfile commitado — sem lock, o gate falha de propósito)
        run: |
          npm ci
          npm test --if-present     # sem script de teste = adicione; o CI cobra
      - if: hashFiles('tsconfig.json') != ''
        name: Type-check
        run: npx tsc --noEmit

      # --- Python ---
      - if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        name: Python (pytest falha se não houver NENHUM teste — cobrança intencional)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q

      # --- Go ---
      - if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: hashFiles('go.mod') != ''
        run: |
          go vet ./...
          go test ./...

      # --- Outro stack: adicione aqui (mesma regra: arquivo modificado sem teste verde = CI vermelho)

  # release (opcional): tag imutável somente quando a main passa em tudo
