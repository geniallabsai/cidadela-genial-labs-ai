# K8s mínimo saudável — baseline completo em skills/cidadela/references/cloud-deploy.md §5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{NOME}}
  labels: {app: {{NOME}}}
spec:
  replicas: 2
  selector: {matchLabels: {app: {{NOME}}}
  template:
    metadata: {labels: {app: {{NOME}}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: REGISTRY/{{NOME}}:TAG   # tag/digest fixo — nunca :latest
          ports: [{containerPort: {{PORTA_CONTAINER}}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          livenessProbe: {httpGet: {path: /healthz, port: {{PORTA_CONTAINER}}}, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /healthz, port: {{PORTA_CONTAINER}}}, periodSeconds: 5}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{NOME}}-db, key: url}}
